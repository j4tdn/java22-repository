<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TODO APP</title>
  <link rel="stylesheet" href="css/todo.css"/>
</head>
<body>
  <p id="errorMsg"></p>
  <div class="card">
    <div class="top">
      <h1>TODO APP</h1>

      <div class="addbar">
        <input type="text" placeholder="A task you want to complete"/>
        <button class="plus" aria-label="Add">+</button>
      </div>
    </div>

    <ul class="list">
      <li class="row">
        <label class="left">
          <input type="checkbox" />
          <span class="txt">Task 1</span>
        </label>
        <button class="trash" aria-label="Delete"></button>
      </li>

      <li class="row">
        <label class="left">
          <input type="checkbox" />
          <span class="txt">Task 2</span>
        </label>
        <button class="trash" aria-label="Delete"></button>
      </li>

      <li class="row">
        <label class="left">
          <input type="checkbox" />
          <span class="txt">Task 3</span>
        </label>
        <button class="trash" aria-label="Delete"></button>
      </li>
    </ul>
  </div>

  <script src="js/todo.js"></script>
</body>
</html>
