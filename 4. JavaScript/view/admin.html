<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>JS Core Index Page</title>
</head>
<body>
	<h1>LESSON 22: JavaScipt - Admin Management Page</h1>

	<hr> 

	<h2>Role: <span class="role"></span></h2>

	<hr>

	<h3><a href="index.html">BACK TO HOME PAGE</a></h3>

	<script>URLSearchParams
		let urlParams = new URLSearchParams(document.location.search);
		let role = urlParams.get('role');
		if (role === 'moderator') {
			document.querySelector('.role').textContent = role;
		} else {
			window.location.href = 'access-denied.html';
		}
	</script>
</body>
</html>
