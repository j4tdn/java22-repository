<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
    <title>Ex05: CSS Flex Wrap Order</title>
    <link rel="icon" href="images/header.png">
    <style>
    	.container {
    		min-height: 800px;
    		border: 2px dotted limegreen;
    		display: flex;

    		width: 800px;
    		flex-wrap: wrap;
    		align-content: flex-start;
    	}

    	.item {
    		width: 200px;
    		height: 150px;
    		background-color: orange;
    		border: 1px solid darkblue;
    		display: flex;
    		justify-content: center;
    		align-items: center;
    	}

    	.item1 {
    		width: 200px;
    	}

    	.item2 {
    		width: 340px;
    	}

    	.item3 {
    		width: 150px;
    	}

    	.item4 {
    		width: 280px;
    	}
    </style>

</head>
<body>

	<div class="container">
		<div class="item item1">Element A1</div>
		<div class="item item2">Element A2</div>
		<div class="item item3">Element A3</div>
		<div class="item item4">Element A4</div>
	</div>


</body>
</html>
