<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
    <title>Ex03: CSS Flex Align Self Items</title>
    <link rel="icon" href="images/header.png">
    <style>
    	.container {
    		height: 800px;
    		border: 2px dotted limegreen;
    		display: flex;
    	    flex-direction: column;
    	    justify-content: flex-start;
    	    align-items: baseline;
    	 }

    	.item {
    		width: 200px;
    		height: 150px;
    		background-color: orange;
    		border: 1px solid darkblue;
    		display: flex;
    		justify-content: center;
    		align-items: center;
    	}

    	.item1 {
    		width: 200px;
    		height: 140px;
    	}

    	.item2 {
    		width: 340px;
    		height: 180px;
    	}

    	.item3 {
    		width: 150px;
    		height: 160px;
    	}
    </style>

</head>
<body>

	<div class="container">
		<div class="item item1">Element A1</div>
		<div class="item item2">Element A2</div>
		<div class="item item3">Element A3</div>
	</div>


</body>
</html>
