<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
    <title>Ex06: CSS Flex Grow Shrink Basis</title>
    <link rel="icon" href="images/header.png">
    <style>
    	.container {
    		min-height: 800px;
    		border: 2px dotted limegreen;
    		display: flex;

    	}

    	.item {
    		width: 200px;
    		height: 150px;
    		background-color: orange;
    		border: 1px solid darkblue;
    		display: flex;
    		justify-content: center;
    		align-items: center;
    	}

    	.item1 {
    		/*width: 200px;
    		max-width: 180px;*/
    	}

    	.item11 {
    		/*flex-basis: 220px;*/
    	}

    	.item2 {
    		/*width: 340px;*/
    		flex-grow: 2;
    	}

    	.item3 {
    		width: 150px;
    	}

    </style>

</head>
<body>

	<div class="container">
		<div class="item item1 item11">Element A1</div>
		<div class="item item2">Element A2</div>
		<div class="item item3">Element A3</div>
	</div>


</body>
</html>
