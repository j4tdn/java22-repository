<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Ex01: CSS Flex Direction</title>
	<link rel="icon" href="../images/header.png">
	
	<style>
		
		.container {
			height: 600px;
			border: 2px dotted limegreen;

			display: flex;
			flex-direction: row; /*row-reverse, column, column reverse*/
		}

		.item {
			width: 200px;
			height: 150px;

			background-color: orange;
			border: 1px solid darkblue;
		}

		.item2 {
			width: 340px;
		}

	</style>	


</head>
<body>

	<div class="container">
		<div class="item item1">Element A1</div>
		<div class="item item2">Element A2</div>
		<div class="item item3">Element A3</div>
	</div>

</body>
</html>
