<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
    <title>Ex02: CSS Flex Justify Content</title>
    <link rel="icon" href="images/header.png">
    <style>
    	.container {
    		height: 600px;
    		border: 2px dotted limegreen;
    		display: flex;
    	    flex-direction: row;
    	    justify-content: flex-start;/* Options: flex-start, flex-end, center, space-between, space-around, space-evenly */
    	    align-items: baseline;/* Options: flex-start, flex-end, center, baseline, stretch */

    	    /*
		    flex-direction: row
		    --> justify-content: main axis - trục ngang (horizontal axis)
		    --> align-items: cross axis - trục dọc (vertical axis)

		    flex-direction: column
		    --> justify-content: cross axis - trục dọc
		    --> align-items: main axis - trục ngang
		  */
    	}

    	.item {
    		width: 200px;
    		height: 150px;
    		background-color: orange;
    		border: 1px solid darkblue;
    		display: flex;
    		justify-content: center;
    		align-items: center;
    	}

    	.item1 {
    		width: 200px;
    		height: 140px;
    	}

    	.item2 {
    		width: 340px;
    		height: 180px;
    	}

    	.item3 {
    		width: 150px;
    		height: 160px;
    	}
    </style>

</head>
<body>

	<div class="container">
		<div class="item item1">Element A1</div>
		<div class="item item2">Element A2</div>
		<div class="item item3">Element A3</div>
	</div>


</body>
</html>
