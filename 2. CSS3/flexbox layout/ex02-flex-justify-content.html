<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Ex02: CSS Flex Justify Content</title>
	<link rel="icon" href="../images/header.png">
	
	<style>
		
		.container {
			height: 800px;
			border: 2px dotted limegreen;

			display: flex;
			flex-direction: row;
			justify-content: flex-start; /*flex-end, center, space-between, space-around, space-evenly*/

			/*flex-direction: row --> justify-content works with main-axis
			                  column --> justify-content works with cross-axis */
		}

		.item {
			width: 200px;
			height: 150px;

			background-color: orange;
			border: 1px solid darkblue;
		}

		.item1 {
			width: 200px;
		}

		.item2 {
			width: 340px;
		}

		.item3 {
			width: 150px;
		}

	</style>	


</head>
<body>

	<div class="container">
		<div class="item item1">Element A1</div>
		<div class="item item2">Element A2</div>
		<div class="item item3">Element A3</div>
	</div>

</body>
</html>
